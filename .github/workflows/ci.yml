name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libjsoncpp-dev
      - name: Configure & build
        run: |
          cd api
          mkdir build && cd build
          cmake .. && make -j$(nproc)

  ml-workers-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ml-workers/requirements.txt
      - run: pytest ml-workers/tests

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx tailwindcss --help
