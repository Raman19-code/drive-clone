apiVersion: apps/v1
kind: Deployment
metadata:
  name: drivex-ml-workers
spec:
  replicas: 2
  selector:
    matchLabels: { app: drivex-ml-workers }
  template:
    metadata:
      labels: { app: drivex-ml-workers }
    spec:
      containers:
        - name: drivex-ml-workers
          image: drivex-ml-workers:latest
          ports: [{ containerPort: 8001 }]
          envFrom:
            - secretRef: { name: drivex-secrets }
