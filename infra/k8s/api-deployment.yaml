apiVersion: apps/v1
kind: Deployment
metadata:
  name: drivex-api
spec:
  replicas: 3
  selector:
    matchLabels: { app: drivex-api }
  template:
    metadata:
      labels: { app: drivex-api }
    spec:
      containers:
        - name: drivex-api
          image: drivex-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - secretRef: { name: drivex-secrets }
---
apiVersion: v1
kind: Service
metadata:
  name: drivex-api
spec:
  selector: { app: drivex-api }
  ports: [{ port: 80, targetPort: 8080 }]
